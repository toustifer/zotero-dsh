# Zotero DSH workbench over the public IP, no domain, no TLS.
#
# Why this exists: Cloudflare's free tier routes China traffic out to an overseas
# edge and back -- the round trip measures ~440ms from a Shenzhen client, and
# 700-1700ms from the Windows box. Hitting this listener directly is ~8ms.
# Same upstream as zotero.stifer.xyz (both land on the 13100 reverse tunnel);
# this one just skips the CDN.
#
# TRADE-OFF, read before using:
#   * Plain HTTP. The auth token and all conversation content travel in the
#     clear. Fine on a trusted network; do NOT use it on open wifi.
#   * No Cloudflare filtering in front, so the two gates below are all that
#     stands between a port scanner and the workbench.
server {
    listen 18100;
    server_name _;

    client_max_body_size 50m;

    # Gate 1 -- geography. Allowlist lives in conf.d/geoip2-allowlist.conf:
    # loopback OR a GeoIP2 city match of 深圳. Everything else gets 403 before
    # it ever reaches basic auth. Added after a Censys scanner collected a 200
    # from this box; basic auth alone was the only line before.
    #
    # If you travel and get locked out, add your current city to the map in
    # geoip2-allowlist.conf, or reach the workbench through zotero.stifer.xyz
    # instead (that path is Cloudflare-fronted and not geo-fenced).
    if ($geo_allowed = 0) {
        return 403;
    }

    # Gate 2 -- credential.
    auth_basic "Zotero DSH";
    auth_basic_user_file /etc/nginx/.htpasswd-dsh;

    # Host is rewritten to the trusted domain on purpose.
    #
    # DSH runs a browser-trust fence that only accepts authorities it was told
    # about (dsh.stifer.xyz / zotero.stifer.xyz / loopback). A bare IP is not on
    # that list, so proxying with Host: <ip> gets a flat 401 with no session
    # cookie. Presenting the domain makes the fence pass and lets the injected
    # cookie below (authority=zotero.stifer.xyz) match.
    set $dsh_host "zotero.stifer.xyz";
    set $dsh_cookie "dsh-auth-492nQduZj_1dNJ7cqn4kWPYfvxzAk59A93Ef_sF_Mts=v1.eyJ2ZXJzaW9uIjoxLCJhdXRob3JpdHkiOiJ6b3Rlcm8uc3RpZmVyLnh5eiIsImlzc3VlZEF0IjoxNzkwNzA2NTExNjY5LCJleHBpcmVzQXQiOjE3OTMyOTg1MTE2Njl9.Hrc-D3swvNTgiHvYTzzSWSSFgY_Ok_KDswYU1fs1b1k";

    # Static bundle: 27MB raw / 8.5MB gzipped. Buffer + cache it -- see the
    # zotero.stifer.xyz vhost for why forwarding it unbuffered breaks phones.
    location ~* ^/(assets/|plugins/|favicon\.ico|manifest\.webmanifest) {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $dsh_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $dsh_cookie;

        proxy_cache dsh_cache;
        proxy_cache_key "$scheme$request_method$dsh_host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=604800";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $dsh_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $dsh_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zotero_conn_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
