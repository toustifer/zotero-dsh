# Zotero DSH workbench over the public IP, no domain, no TLS.
#
# Upstream is the 13100 reverse tunnel; same as the zotero.stifer.xyz vhost,
# just without the CDN in between (CF routes China traffic overseas and back:
# ~440ms vs ~8ms here).
#
# ── THREE header rewrites, all load-bearing ──
#
# DSH's browser-trust fence checks BOTH Host and Origin against an allowlist of
# authorities it was told about. Proxying with the caller's own values fails in
# two different ways depending on the request type:
#
#   Host   = bare IP  -> HTML loads? no. Every request 401s and no session
#                        cookie is ever issued.
#   Origin = bare IP  -> the page DOES render (top-level navigation carries no
#                        Origin), but every /api call behind it gets a 9-byte
#                        "forbidden". That is what "工作区连接不上" looks like
#                        from the browser: the shell paints, the session layer
#                        cannot talk.
#
# So all three of Host / Origin / Referer are rewritten to the trusted domain.
# Verified: /api/remote.mux returns 403 with the IP origin and 404 (= past the
# fence, wrong route) with the domain origin.
#
# TRADE-OFF: plain HTTP. The auth token and all content travel in the clear.
# Fine on a trusted network; do NOT use it on open wifi.
server {
    listen 18100;
    server_name _;

    client_max_body_size 50m;

    # Gate 1 -- address allowlist (see conf.d/geoip2-allowlist.conf).
    if ($geo_allowed = 0) {
        return 403;
    }

    # Gate 2 -- credential.
    auth_basic "Zotero DSH";
    auth_basic_user_file /etc/nginx/.htpasswd-dsh;

    set $dsh_host   "zotero.stifer.xyz";
    set $dsh_origin "http://zotero.stifer.xyz";
    set $dsh_cookie "dsh-auth-492nQduZj_1dNJ7cqn4kWPYfvxzAk59A93Ef_sF_Mts=v1.eyJ2ZXJzaW9uIjoxLCJhdXRob3JpdHkiOiJ6b3Rlcm8uc3RpZmVyLnh5eiIsImlzc3VlZEF0IjoxNzkwNzA2NTExNjY5LCJleHBpcmVzQXQiOjE3OTMyOTg1MTE2Njl9.Hrc-D3swvNTgiHvYTzzSWSSFgY_Ok_KDswYU1fs1b1k";

    # Static bundle: 27MB raw / 8.5MB gzipped. Buffered + cached -- unbuffered
    # forwarding breaks phones on a payload this size.
    location ~* ^/(assets/|plugins/|favicon\.ico|manifest\.webmanifest) {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $dsh_host;
        proxy_set_header Origin $dsh_origin;
        proxy_set_header Referer "$dsh_origin/";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $dsh_cookie;

        proxy_cache dsh_cache;
        proxy_cache_key "$scheme$request_method$dsh_host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=604800";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Dynamic API / WebSocket / HTML. streaming -- no buffering.
    location / {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $dsh_host;
        proxy_set_header Origin $dsh_origin;
        proxy_set_header Referer "$dsh_origin/";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $dsh_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zotero_conn_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
