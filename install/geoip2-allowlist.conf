# Entry-point allowlist for the public DSH listener.
#
# WHY THIS IS NOT PURE GEOIP:
#   The first cut fenced 18100 with "city == 深圳" only. The access log then
#   showed the user's own phone (112.97.85.54) getting 305x200 and 59x403 --
#   the same address, intermittently rejected. GeoIP2 city resolution is not a
#   reliable per-request gate, and a gate that randomly shuts out its owner is
#   worse than no gate at all.
#
#   So the allowlist is now explicit addresses first (deterministic), with the
#   city lookup kept only as a widening condition: an unknown address that
#   resolves to Shenzhen is still let through. Failing the lookup no longer
#   locks anyone out who is on the list.
#
# Refresh the .mmdb every few months; Chinese mobile ranges move.

geoip2 /usr/share/GeoIP/GeoLite2-City.mmdb {
    # No auto_reload: reloading the database in place opens a window where
    # lookups can come back empty, which is one suspect for the flapping above.
    $geoip2_city_zh      city names zh-CN;
    $geoip2_subdiv_zh    subdivisions 0 names zh-CN;
    $geoip2_country_code country iso_code;
}

# ── Deterministic side: addresses we know are the owner's ──
map $remote_addr $is_known {
    127.0.0.1        1;   # loopback (server itself, health checks, my probes)
    ::1              1;
    112.97.85.54     1;   # China Unicom mobile  -- the phone
    222.125.198.221  1;   # Topway fixed line    -- the home/office uplink
    default          0;
}

# ── Widening side: unknown address but geolocates to Shenzhen ──
map $geoip2_city_zh $is_shenzhen {
    深圳   1;
    default 0;
}

# Either side is enough.
map "$is_known$is_shenzhen" $geo_allowed {
    "10"     1;
    "11"     1;
    "01"     1;   # unknown IP that looks like Shenzhen -- the phone after a
                  # DHCP lease change, before the address list is updated
    default  0;
}
