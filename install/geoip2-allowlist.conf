# GeoIP2 city lookup + the Shenzhen-only allowlist used by the public entry points.
#
# Database: GeoLite2-City.mmdb (free, MaxMind). Verified against the only two
# addresses that actually reach this box:
#   112.97.85.54    -> Shenzhen / Guangdong / CN   (China Unicom, mobile)
#   222.125.198.221 -> Shenzhen / Guangdong / CN   (Topway, fixed line)
#
# Rationale: the 18100 listener is plain HTTP with no CDN in front, and a Censys
# scanner already walked away with a 200 from this box. Basic auth alone is a
# thin line, so narrow the door to the city the user actually lives in.
#
# Refresh the database from https://github.com/P3TERX/GeoLite.mmdb (or MaxMind's
# own mirror) every few months; city accuracy for Chinese mobile ranges does
# drift.

geoip2 /usr/share/GeoIP/GeoLite2-City.mmdb {
    auto_reload 5m;
    $geoip2_city_zh        city names zh-CN;
    $geoip2_subdiv_zh      subdivisions 0 names zh-CN;
    $geoip2_country_code   country iso_code;
}

# A missing lookup (private range, unresolvable) leaves the variable empty, so
# everything is deny-by-default rather than accidentally allow.
map $geoip2_city_zh $from_shenzhen {
    深圳   1;
    default 0;
}

map $remote_addr $from_loopback {
    127.0.0.1  1;
    ::1        1;
    default    0;
}

# Single decision variable: loopback OR Shenzhen.
map "$from_loopback$from_shenzhen" $geo_allowed {
    "10"  1;
    "01"  1;
    default 0;
}
