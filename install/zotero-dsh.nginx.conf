# Zotero DSH workbench (this Windows box's 13081) exposed as zotero.stifer.xyz.
#
# Path: Cloudflare -> cloudflared -> 127.0.0.1:13082 (here) -> 127.0.0.1:13100
#       (sshd reverse tunnel from the Windows box) -> that box's 13081.
#
# Why the hostname is two levels and not three:
#   Cloudflare's free Universal SSL only covers stifer.xyz and *.stifer.xyz.
#   zotero.dsh.stifer.xyz is a third level -> no edge certificate -> the TLS
#   handshake dies with "sslv3 alert handshake failure". Keep it at two levels
#   unless an Advanced Certificate is added for *.dsh.stifer.xyz.
#
# NOTE: deliberately does NOT redefine $connection_upgrade -- dsh.stifer.xyz
# already defines that map in the http scope and a second definition is a
# duplicate-map error. Hence the distinct variable name below.
map $http_upgrade $zotero_conn_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 127.0.0.1:13082;
    server_name zotero.stifer.xyz;

    client_max_body_size 50m;

    auth_basic "Zotero DSH";
    auth_basic_user_file /etc/nginx/.htpasswd-dsh;

    # DSH's own auth cookie, injected here so the workbench opens without a
    # ?token=... in the URL. DSH rotates the URL token on every restart but the
    # cookie signing key is persistent, so this stays valid for its 30-day life.
    # To refresh: open http://127.0.0.1:13100/?token=<token from the Windows box's
    # ~/.dsh-zotero/web-3081.log> and copy the set-cookie value here.
    set $dsh_cookie "dsh-auth-492nQduZj_1dNJ7cqn4kWPYfvxzAk59A93Ef_sF_Mts=v1.eyJ2ZXJzaW9uIjoxLCJhdXRob3JpdHkiOiJ6b3Rlcm8uc3RpZmVyLnh5eiIsImlzc3VlZEF0IjoxNzkwNzA2NTExNjY5LCJleHBpcmVzQXQiOjE3OTMyOTg1MTE2Njl9.Hrc-D3swvNTgiHvYTzzSWSSFgY_Ok_KDswYU1fs1b1k";

    # ── 静态资源：分开处理，别走下面那个 location / ──
    #
    # 这里的 client bundle 是 60 个插件合并出的单文件：原始 ~27MB，gzip 后 ~8.5MB，
    # 而它的 URL 是 /plugins/??a/client.js,b/client.js,...&rev=xxx —— 不以 .js 结尾，
    # Cloudflare 的默认按扩展名匹配规则不认它，等于每次都穿透到源站。
    #
    # location / 里的 proxy_buffering off 是给 agent 流式输出用的：流式时不该等整包。
    # 但对一个 8.5MB 的 JS 来说，off 会让数据边收边转，移动网络下极容易中断 ——
    # 表现就是手机端 "Failed to load plugins"。静态资源走缓冲 + 缓存才对。
    location ~* ^/(assets/|plugins/|favicon\.ico|manifest\.webmanifest) {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $dsh_cookie;

        proxy_cache dsh_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=604800";

        # 缓冲开着（默认），但把超时放宽：首次回源要 27MB 过隧道。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 动态 API / WebSocket / HTML：保持流式，不缓冲 ──
    location / {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $dsh_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zotero_conn_upgrade;
        # DSH streams agent output; buffering would stall it, and agent turns
        # can run far longer than the default 60s read timeout.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
